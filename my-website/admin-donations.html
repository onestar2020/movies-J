<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies-J Admin - Donors Manager</title>
    
    <link rel="icon" href="images/logo-192.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: #181818; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #e50914; margin-bottom: 20px; text-align: center; font-size: 1.4rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input { width: 100%; background: #252525; border: 1px solid #444; border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus { border-color: #e50914; }
        .btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #b20710; }
        .auth-btn { background: #4285F4; margin-bottom: 20px; }
        .auth-btn:hover { background: #3367D6; }
        .hidden { display: none; }
        .donor-preview { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .donor-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }
        .delete-btn { color: #ff5252; cursor: pointer; background: transparent; border: none; }
    </style>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="admin-card">
        <h2>🎬 Movies-J Donors Manager</h2>

        <!-- Login Section -->
        <div id="authSection">
            <p style="font-size:0.85rem; color:#bbb; text-align:center; margin-bottom:15px;">Admin access only. Sign in with your registered Gmail.</p>
            <button class="btn auth-btn" onclick="loginWithGoogle()"><i class="fab fa-google"></i> Login with Google</button>
        </div>

        <!-- Admin Control Panel -->
        <div id="managerSection" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span id="userEmail" style="font-size:0.8rem; color:#81c784;"></span>
                <a href="#" onclick="logout()" style="color:#ff5252; font-size:0.8rem; text-decoration:none;">Logout</a>
            </div>

            <form id="addDonorForm" onsubmit="addDonor(event)">
                <div class="form-group">
                    <label>Donor Display Name</label>
                    <input type="text" id="dName" placeholder="e.g. Mark D." required>
                </div>
                <div class="form-group">
                    <label>Amount Donated (₱)</label>
                    <input type="number" id="dAmount" placeholder="e.g. 200" required>
                </div>
                <div class="form-group">
                    <label>Message / Note</label>
                    <input type="text" id="dMessage" placeholder="e.g. Salamat idol Jay!" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-plus"></i> Add Verified Supporter</button>
            </form>

            <div class="donor-preview">
                <h4 style="font-size:0.9rem; margin-bottom:10px; color:#ffd700;">Live Donors List:</h4>
                <div id="donorsListAdmin">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Ilagay dito ang kinopya mula sa Firebase Project Settings
       const firebaseConfig = {
    apiKey: "AIzaSyCnLKuEGAVTC3V-_lGqKYFRVuCXx5I5Feo",
    authDomain: "movies-j-stream.firebaseapp.com",
    databaseURL: "https://movies-j-stream-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "movies-j-stream",
    storageBucket: "movies-j-stream.firebasestorage.app",
    messagingSenderId: "1088305700283",
    appId: "1:1088305700283:web:1b94c89927d4b88240789e",
    measurementId: "G-LMNWJGZ9K4"
};
firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.database();
        const ADMIN_GMAIL = "jayjovendinawanao29@gmail.com";

        auth.onAuthStateChanged(user => {
            if (user && user.email === ADMIN_GMAIL) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('managerSection').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
                loadDonorsForAdmin();
            } else {
                if (user) {
                    alert("Access Denied: Your email is not authorized as admin.");
                    auth.signOut();
                }
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('managerSection').classList.add('hidden');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => alert("Login Error: " + e.message));
        }

        function logout() {
            auth.signOut();
        }

        function addDonor(e) {
            e.preventDefault();
            const name = document.getElementById('dName').value.trim();
            const amountVal = Number(document.getElementById('dAmount').value);
            const message = document.getElementById('dMessage').value.trim();
            const dateStr = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(new Date());

            db.ref('donors').push({
                name: name,
                amountVal: amountVal,
                message: message,
                date: dateStr,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('addDonorForm').reset();
            }).catch(e => alert("Database Error: " + e.message));
        }

        function loadDonorsForAdmin() {
            db.ref('donors').on('value', snapshot => {
                const data = snapshot.val();
                const container = document.getElementById('donorsListAdmin');
                if (!data) {
                    container.innerHTML = "<p style='color:#666; font-size:0.8rem;'>No donors yet.</p>";
                    return;
                }
                
                const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);
                
                container.innerHTML = sortedKeys.map(key => {
                    const d = data[key];
                    return `
                        <div class="donor-row">
                            <span><strong>${d.name}</strong> - ₱${d.amountVal}</span>
                            <button class="delete-btn" onclick="deleteDonor('${key}')" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
            });
        }

        function deleteDonor(key) {
            if (confirm("Delete this supporter entry from the live site?")) {
                db.ref(`donors/${key}`).remove();
            }
        }
    </script>
</body>
</html>
