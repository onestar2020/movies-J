<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies-J Admin - Donors Manager</title>
    
    <link rel="icon" href="images/logo-192.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: #181818; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #e50914; margin-bottom: 20px; text-align: center; font-size: 1.4rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input { width: 100%; background: #252525; border: 1px solid #444; border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus { border-color: #e50914; }
        .btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #b20710; }
        .hidden { display: none; }
        .donor-preview { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .donor-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; border-left: 3px solid #e50914; }
        .delete-btn { color: #ff5252; cursor: pointer; background: transparent; border: none; font-size: 1rem; padding: 4px 8px; }
        .delete-btn:hover { color: #ff1744; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🎬 Movies-J Donors Manager</h2>

        <!-- PIN Entry Section -->
        <div id="authSection">
            <p style="font-size:0.85rem; color:#bbb; text-align:center; margin-bottom:15px;">Admin Protected Area. Enter Master PIN to access:</p>
            <form onsubmit="verifyPin(event)">
                <div class="form-group">
                    <input type="password" id="adminPinInput" placeholder="Enter Admin PIN" style="text-align:center; font-size:1.2rem; letter-spacing:4px;" required autofocus>
                </div>
                <button type="submit" class="btn"><i class="fas fa-lock-open"></i> Unlock Dashboard</button>
            </form>
        </div>

        <!-- Admin Control Panel -->
        <div id="managerSection" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
                <span style="font-size:0.8rem; color:#81c784;"><i class="fas fa-check-circle"></i> Authenticated Admin</span>
                <a href="#" onclick="logoutAdmin()" style="color:#ff5252; font-size:0.8rem; text-decoration:none;"><i class="fas fa-sign-out-alt"></i> Lock</a>
            </div>

            <form id="addDonorForm" onsubmit="addDonor(event)">
                <div class="form-group">
                    <label>Donor Display Name</label>
                    <input type="text" id="dName" placeholder="e.g. Mark D." required>
                </div>
                <div class="form-group">
                    <label>Amount Donated (₱)</label>
                    <input type="number" id="dAmount" placeholder="e.g. 200" required>
                </div>
                <div class="form-group">
                    <label>Message / Note</label>
                    <input type="text" id="dMessage" placeholder="e.g. Salamat idol Jay!" required>
                </div>
                <button type="submit" id="submitBtn" class="btn"><i class="fas fa-plus"></i> Add Verified Supporter</button>
            </form>

            <div class="donor-preview">
                <h4 style="font-size:0.9rem; margin-bottom:10px; color:#ffd700;"><i class="fas fa-list"></i> Live Donors List:</h4>
                <div id="donorsListAdmin">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://movies-j-stream-default-rtdb.asia-southeast1.firebasedatabase.app";
        const ADMIN_PIN = "2929"; // ⬅️ Ang iyong secret admin PIN

        function verifyPin(e) {
            e.preventDefault();
            const entered = document.getElementById('adminPinInput').value;
            if (entered === ADMIN_PIN) {
                sessionStorage.setItem("moviesj_admin_auth", "true");
                showAdminPanel();
            } else {
                alert("Incorrect Admin PIN!");
                document.getElementById('adminPinInput').value = "";
            }
        }

        function showAdminPanel() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('managerSection').classList.remove('hidden');
            loadDonorsForAdmin();
        }

        function logoutAdmin() {
            sessionStorage.removeItem("moviesj_admin_auth");
            location.reload();
        }

        async function loadDonorsForAdmin() {
            const container = document.getElementById('donorsListAdmin');
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/donors.json`);
                const data = await res.json();
                
                if (!data) {
                    container.innerHTML = "<p style='color:#666; font-size:0.8rem; text-align:center;'>No donors in database yet.</p>";
                    return;
                }

                const sortedKeys = Object.keys(data).sort((a, b) => (data[b].timestamp || 0) - (data[a].timestamp || 0));

                container.innerHTML = sortedKeys.map(key => {
                    const d = data[key];
                    return `
                        <div class="donor-row">
                            <div>
                                <strong>${d.name}</strong> — <span style="color:#4CAF50;">₱${d.amountVal}</span>
                                <div style="font-size:0.75rem; color:#888;">"${d.message}" • ${d.date}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteDonor('${key}')" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = "<p style='color:#ff5252; font-size:0.8rem;'>Error loading list.</p>";
            }
        }

        async function addDonor(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;

            const name = document.getElementById('dName').value.trim();
            const amountVal = Number(document.getElementById('dAmount').value);
            const message = document.getElementById('dMessage').value.trim();
            const dateStr = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(new Date());

            const payload = {
                name: name,
                amountVal: amountVal,
                message: message,
                date: dateStr,
                timestamp: Date.now()
            };

            try {
                const res = await fetch(`${FIREBASE_DB_URL}/donors.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('addDonorForm').reset();
                    loadDonorsForAdmin();
                } else {
                    alert("Failed to save to database.");
                }
            } catch (err) {
                alert("Network Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-plus"></i> Add Verified Supporter`;
            }
        }

        async function deleteDonor(key) {
            if (!confirm("Are you sure you want to delete this supporter?")) return;
            try {
                await fetch(`${FIREBASE_DB_URL}/donors/${key}.json`, { method: 'DELETE' });
                loadDonorsForAdmin();
            } catch (err) {
                alert("Error deleting: " + err.message);
            }
        }

        // Auto-login kung nasa session pa
        if (sessionStorage.getItem("moviesj_admin_auth") === "true") {
            showAdminPanel();
        }
    </script>
</body>
</html>
