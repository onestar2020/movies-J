<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Browse - Movies-J</title>
  <meta name="theme-color" content="#e50914" />

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/logo-192.png" type="image/png">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://movies-j-api-proxy.jayjovendinawanao2020.workers.dev">
  <link rel="dns-prefetch" href="https://movies-j-api-proxy.jayjovendinawanao2020.workers.dev">
  <link rel="preconnect" href="https://movies-j-stream-default-rtdb.asia-southeast1.firebasedatabase.app">
  <link rel="dns-prefetch" href="https://movies-j-stream-default-rtdb.asia-southeast1.firebasedatabase.app">
  <link rel="preconnect" href="https://apis.google.com">
  <link rel="dns-prefetch" href="https://api.dicebear.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Movies-J Premium Design System -->
  <link rel="stylesheet" href="css/theme.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=6">
  <link rel="stylesheet" href="css/auth.css?v=3">
  <link rel="stylesheet" href="css/changelog.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>

<body>
  <nav class="navbar">
    <div class="navbar-container">
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="index.html"><img src="images/logo-512.png" alt="Movies-J Logo" class="logo-effect" /></a>
        <div id="online-counter-badge" title="Users Currently Online">
          <div id="online-dot"></div>
          <span id="online-count">1</span> Online
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse.html?type=movie">Movies</a>
        <a href="browse.html?type=tv">TV Shows</a>
        <a href="browse.html?type=anime">Anime</a>
      </div>
      <div class="nav-actions">
        <div id="auth-nav-container"></div>
        <i class="fas fa-search" title="Search (press /)" onclick="openSearchModal()"></i>
        <button class="watch-history-btn" title="Watch History">
          <i class="fas fa-history"></i>
        </button>
        <div class="hamburger-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>
    </div>
  </nav>

  <main class="browse-container">
    <div class="browse-header">
      <h1 id="browse-title">Loading...</h1>
      <select id="genre-filter">
        <option value="">All Genres</option>
      </select>
    </div>

    <div id="browse-grid"></div>

    <div class="load-more-container">
      <button id="load-more-btn">Load More</button>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 Movies-J. All rights reserved.</p>
      <div class="footer-links">
        <a href="disclaimer.html">Disclaimer</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Search Modal (page-local, app.js will reuse it) -->
  <div class="search-modal" id="search-modal">
    <div class="search-content">
      <button class="close" onclick="closeSearchModal()">&times;</button>
      <div class="search-input-container">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search movies, TV shows, anime..." autocomplete="off" />
      </div>
      <div class="results" id="search-results"></div>
      <div id="no-results-message" style="display:none;">No results found. Try a different keyword.</div>
    </div>
  </div>

  <!-- Details Modal -->
  <div class="modal" id="details-modal">
    <div class="details-modal-content">
      <span class="close" id="close-details-modal">&times;</span>
      <div class="modal-backdrop"></div>
      <div class="modal-body">
        <img id="modal-poster" src="" alt="Poster">
        <div class="modal-text">
          <h1 id="modal-title">Movie Title</h1>
          <div class="modal-meta">
            <span id="modal-rating">⭐ 8.5</span>
            <span id="modal-release">2024</span>
          </div>
          <p id="modal-description">This is the full movie description...</p>
          <div class="modal-genres" id="modal-genres"></div>
          <div class="modal-buttons">
            <button class="btn btn-primary" id="modal-watch-btn">
              <i class="fas fa-play"></i> Watch Now
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Watch History Modal -->
  <div class="modal" id="watch-history-modal">
    <div class="modal-content" style="max-width: 860px;">
      <span class="close" id="close-history-modal">&times;</span>
      <h2><i class="fas fa-history" style="color: var(--primary);"></i> Watch History</h2>
      <div id="watch-history-list"></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js?v=11" type="module"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/home.js" defer></script>
  <script src="js/watchHistory.js" defer></script>
  <script src="js/browse.js" defer></script>
  <script src="js/changelog.js" defer></script>
</body>
</html>
