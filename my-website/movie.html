<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Movies-J - Stream</title>
    
    <link rel="icon" href="images/logo-192.png" type="image/png">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/changelog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        :root { --primary: #e50914; --bg: #111; --card-bg: #181818; --text-muted: #999; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

        /* Header */
        .header { padding: 12px 20px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; background: rgba(20, 20, 20, 0.95); position: sticky; top: 0; z-index: 999; backdrop-filter: blur(10px); }
        .home-btn { font-size: 1rem; color: #ccc; background: #222; border: 1px solid #333; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; }
        .home-btn:hover { background: var(--primary); color: #fff; }
        .header-title { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; text-align: center; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        /* Layout */
        .container { max-width: 1400px; margin: 15px auto; padding: 0 15px; display: flex; gap: 25px; }
        .main-stage { flex: 2.8; min-width: 0; }
        .side-stage { flex: 1.2; min-width: 320px; }

        /* Player */
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
        .video-box iframe { width: 100%; height: 100%; border: none; }

        /* Sidebar Panels */
        .panel { background: var(--card-bg); border: 1px solid #252525; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .panel-label { font-size: 0.9rem; font-weight: 600; color: #ccc; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .panel-label-left { display: flex; align-items: center; gap: 8px; }
        .panel-label-left i { color: var(--primary); }

        /* Server Buttons */
        .server-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .srv-btn, .server-btn { background: #252525; border: 1px solid #333; color: #ccc; padding: 10px 8px; border-radius: 8px; font-family: inherit; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s; text-align: center; }
        .srv-btn:hover, .server-btn:hover { background: #333; color: #fff; }
        .srv-btn.active, .server-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

        /* TV Episode Navigator */
        .tv-navigator { display: none; }
        .season-btn { width: 100%; background: #252525; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .season-dropdown { display: none; background: #202020; border: 1px solid #333; border-radius: 8px; max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
        .season-dropdown button { width: 100%; padding: 10px 14px; background: none; border: none; color: #ccc; text-align: left; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .season-dropdown button:hover { background: #333; color: #fff; }
        
        .episode-list { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
        .ep-card, .episode-card { display: flex; gap: 10px; padding: 8px; border-radius: 8px; background: #202020; border: 1px solid transparent; cursor: pointer; transition: 0.2s; align-items: center; }
        .ep-card:hover, .episode-card:hover { background: #282828; }
        .ep-card.active, .episode-card.active { border-color: var(--primary); background: #252525; }
        .ep-card img, .episode-card img { width: 90px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .ep-info h4, .episode-details h3 { font-size: 0.8rem; color: #fff; font-weight: 500; }
        .ep-info p, .episode-details p { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Media Info */
        .meta-header { margin: 20px 0 12px; }
        .meta-title { font-size: 1.6rem; font-weight: 700; }
        .meta-tags { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .meta-badge { background: #222; border: 1px solid #333; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; color: #aaa; }
        
        .facts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1px solid #222; }
        .fact-box h5 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .fact-box p { font-size: 0.8rem; color: #ddd; font-weight: 500; }

        .overview-text { color: #bbb; line-height: 1.6; font-size: 0.88rem; margin: 12px 0 25px; }

        /* Cast Scroller */
        .section-heading { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; }
        .cast-scroller { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .cast-scroller::-webkit-scrollbar { display: none; }
        .cast-card { flex: 0 0 115px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #222; flex-shrink: 0; }
        .cast-card img { width: 100%; aspect-ratio: 1/1.2; object-fit: cover; }
        .cast-name { padding: 8px; font-size: 0.75rem; text-align: center; }
        .cast-name h6 { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cast-name span { color: var(--text-muted); font-size: 0.68rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Recommendations */
        .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 12px; }
        .rec-card { border-radius: 8px; overflow: hidden; background: #1c1c1c; text-decoration: none; border: 1px solid #222; transition: 0.2s; }
        .rec-card:hover { transform: translateY(-3px); border-color: #444; }
        .rec-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .rec-card h6 { padding: 6px; font-size: 0.75rem; color: #ddd; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Pulse animation */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        /* ================= FLOATING BRAVE AD-BLOCK TOAST ================= */
        .brave-floating-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99998;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-left: 4px solid #ff5000;
            border-radius: 10px;
            padding: 12px 14px;
            max-width: 330px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 10px rgba(255, 80, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUpToast 0.4s ease-out;
        }

        @keyframes slideUpToast {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .brave-toast-icon {
            font-size: 20px;
            color: #ff5000;
            flex-shrink: 0;
        }

        .brave-toast-text {
            font-size: 0.78rem;
            color: #ccc;
            line-height: 1.35;
        }

        .brave-toast-text strong {
            color: #fff;
        }

        .brave-toast-link {
            color: #ff5000;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin-top: 3px;
        }

        .brave-toast-link:hover {
            text-decoration: underline;
        }

        .brave-toast-close {
            background: transparent;
            border: none;
            color: #777;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1;
            margin-left: auto;
            flex-shrink: 0;
        }

        .brave-toast-close:hover {
            color: #fff;
        }

        /* ================= MOBILE-FIRST RESPONSIVE DESIGN ================= */
        @media (max-width: 900px) {
            .container { flex-direction: column; padding: 0 10px; margin-top: 0; gap: 15px; }
            .header { padding: 10px 15px; }

            .video-box { 
                position: sticky; 
                top: 63px; 
                z-index: 990; 
                border-radius: 0 0 12px 12px;
                margin-left: -10px;
                margin-right: -10px;
                width: calc(100% + 20px);
            }

            .main-stage { display: flex; flex-direction: column; }
            .side-stage { order: 2; width: 100%; min-width: 100%; }
            .meta-header { order: 3; }
            .facts-grid { order: 4; grid-template-columns: repeat(2, 1fr); }
            .overview-text { order: 5; margin-bottom: 20px; }
            .main-stage > .section-heading:nth-of-type(1) { order: 6; }
            .cast-scroller { order: 7; }
            .main-stage > .section-heading:nth-of-type(2) { order: 8; }
            .rec-grid { order: 9; grid-template-columns: repeat(3, 1fr); gap: 8px; }

            .meta-title { font-size: 1.3rem; }
            .server-grid { grid-template-columns: repeat(2, 1fr); }

            .episode-list {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                max-height: none;
                padding-bottom: 8px;
                gap: 8px;
                scrollbar-width: none;
            }
            .episode-list::-webkit-scrollbar { display: none; }
            .ep-card, .episode-card {
                flex: 0 0 160px;
                flex-direction: column;
                align-items: flex-start;
                padding: 6px;
            }
            .ep-card img, .episode-card img {
                width: 100%;
                aspect-ratio: 16/9;
            }
            .ep-info h4, .episode-details h3 {
                font-size: 0.75rem;
                margin-top: 4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
            }
            .ep-info p, .episode-details p {
                display: none;
            }

            .brave-floating-toast {
                bottom: 12px;
                right: 12px;
                left: 12px;
                max-width: none;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="home-btn" title="Back"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title" id="page-header-title">Now Playing</div>
        
        <div class="header-actions">
            <!-- Active Users Counter -->
            <div class="active-users-counter" title="Users Online Now" style="display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; border: 1px solid #333;">
                <div style="width: 6px; height: 6px; background-color: #4CAF50; border-radius: 50%; box-shadow: 0 0 6px #4CAF50; animation: pulse 1.5s infinite;"></div>
                <span id="online-count">1</span> Online
            </div>

            <!-- Changelog / Updates Notification Button -->
            <button id="changelog-btn" class="changelog-nav-btn" title="What's New / Logs">
                <i class="fas fa-bell"></i>
            </button>
        </div>
    </header>

    <!-- Floating Brave Ad-Block Notice -->
    <div id="braveFloatingToast" class="brave-floating-toast">
        <i class="fas fa-shield-halved brave-toast-icon"></i>
        <div class="brave-toast-text">
            <span>Tired of server pop-up ads? Use <strong>Brave Browser</strong> for ad-free streaming!</span><br>
            <a href="https://brave.com/" target="_blank" rel="noopener noreferrer" class="brave-toast-link">Get Brave Browser &rarr;</a>
        </div>
        <button class="brave-toast-close" onclick="dismissBraveToast()" title="Close">&times;</button>
    </div>

    <div class="container">
        
        <!-- Main Stage -->
        <main class="main-stage">
            <div class="video-box">
                <iframe id="movie-player" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; clipboard-write"></iframe>
            </div>

            <div class="meta-header">
                <h1 class="meta-title" id="media-title">Loading...</h1>
                <div class="meta-tags" id="media-badges"></div>
            </div>

            <div class="facts-grid">
                <div class="fact-box"><h5>Runtime</h5><p id="fact-runtime">-</p></div>
                <div class="fact-box"><h5>Release Date</h5><p id="fact-release">-</p></div>
                <div class="fact-box"><h5>Rating</h5><p id="fact-rating">-</p></div>
                <div class="fact-box"><h5>Country</h5><p id="fact-country">-</p></div>
            </div>

            <p class="overview-text" id="media-overview"></p>

            <!-- Cast Section -->
            <div class="section-heading">Cast</div>
            <div class="cast-scroller" id="cast-container"></div>

            <!-- More Like This -->
            <div class="section-heading" style="margin-top: 25px;">More Like This</div>
            <div class="rec-grid" id="rec-container"></div>
        </main>

        <!-- Side Stage (Servers & TV Episodes) -->
        <aside class="side-stage">
            <div class="panel">
                <div class="panel-label">
                    <div class="panel-label-left">
                        <i class="fas fa-play-circle"></i> Choose Server to Watch Full:
                    </div>
                </div>
                <div class="server-grid" id="server-buttons"></div>
            </div>

            <!-- TV Episode Navigator -->
            <div class="panel tv-navigator" id="tv-panel">
                <div class="panel-label">
                    <div class="panel-label-left">
                        <i class="fas fa-list"></i> Episodes:
                    </div>
                    <button id="next-ep-btn" style="background: #222; border: 1px solid #444; color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s;">
                        Next Ep <i class="fas fa-step-forward"></i>
                    </button>
                </div>
                <button class="season-btn" id="season-toggle">
                    <span id="season-current-label">Season 1</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="season-dropdown" id="season-dropdown"></div>
                <div class="episode-list" id="episode-list"></div>
            </div>

            <!-- Collection Sidebar -->
            <div class="panel" id="collection-sidebar" style="display: none;">
                <div class="panel-label">
                    <div class="panel-label-left">
                        <i class="fas fa-film"></i> Collection:
                    </div>
                </div>
                <div class="episode-list" id="collection-list-container"></div>
            </div>
        </aside>

    </div>

    <!-- Dismissal Logic -->
    <script>
        function dismissBraveToast() {
            const toast = document.getElementById('braveFloatingToast');
            if (toast) {
                toast.style.display = 'none';
                sessionStorage.setItem('movies_j_brave_toast_dismissed', 'true');
            }
        }

        if (sessionStorage.getItem('movies_j_brave_toast_dismissed') === 'true') {
            const toast = document.getElementById('braveFloatingToast');
            if (toast) toast.style.display = 'none';
        }
    </script>

    <!-- External Script Calls -->
    <script src="js/servers.js"></script>
    <script src="js/movie.js"></script>
    <script src="js/changelog.js"></script>
</body>
</html>
