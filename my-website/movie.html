<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies-J - Player</title>
    
    <link rel="icon" href="images/logo-192.png" type="image/png">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5209861049704399"
            crossorigin="anonymous"></script>

    <style>
        body { background: #111; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        
        /* Header & Navigation */
        .header { padding: 15px; border-bottom: 1px solid #333; text-align: center; position: relative; display: flex; align-items: center; justify-content: center; background: #141414; }
        .home-button { 
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%); 
            font-size: 1.1rem; color: #ccc; background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.3s;
        }
        .home-button:hover { background-color: rgba(255, 255, 255, 0.2); color: #fff; }
        #movie-title { margin: 0; font-size: 1.6rem; padding: 0 50px; }

        /* Main Layout */
        .page-container { padding: 20px; max-width: 1400px; margin: auto; }
        .main-content-wrapper { display: flex; gap: 25px; align-items: flex-start; margin-top: 10px; }

        /* Left Side: Player & Info */
        .player-column { flex: 2.8; min-width: 0; }
        .video-container { width: 100%; margin-bottom: 20px; position: relative; }
        iframe#movie-player, video#hls-player { 
            width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; border: none; 
            background-color: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
        }
        video#hls-player { display: none; }

        /* Right Side: Sidebar */
        .sidebar-column {
            flex: 1.2; background: #181818; padding: 20px; border-radius: 12px;
            position: sticky; top: 20px; max-height: calc(100vh - 40px);
            overflow-y: auto; border: 1px solid #222;
        }

        /* Server Controls */
        .server-container label { display: block; margin-bottom: 15px; font-weight: bold; font-size: 1rem; color: #aaa; }
        #server-buttons-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        .server-btn {
            background-color: #333; color: #ccc; border: 1px solid #444;
            border-radius: 5px; padding: 8px 12px; font-family: inherit;
            font-size: 0.85rem; cursor: pointer; transition: 0.2s;
        }
        .server-btn:hover { background-color: #444; color: #fff; }
        .server-btn.active { background-color: #e50914; color: #fff; border-color: #e50914; font-weight: bold; }

        /* Collection Sidebar Section */
        #collection-sidebar { display: none; margin-top: 10px; border-top: 1px solid #333; padding-top: 20px; }
        #collection-list-container { display: flex; flex-direction: column; gap: 10px; }

        /* TV & Anime Browser (Episodes) */
        .tv-show-browser { display: none; margin-top: 10px; border-top: 1px solid #333; padding-top: 20px; }
        .season-selector-container { position: relative; }
        #season-selector-btn {
            width: 100%; background-color: #222; border: 1px solid #444; color: #fff;
            padding: 12px; border-radius: 5px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        #season-dropdown-menu {
            position: absolute; background: #222; border: 1px solid #444; width: 100%;
            z-index: 100; border-radius: 5px; display: none; top: 100%; margin-top: -10px;
            max-height: 250px; overflow-y: auto;
        }
        #season-dropdown-menu button {
            display: block; width: 100%; padding: 10px 15px; background: none; border: none; color: #fff; text-align: left; cursor: pointer;
        }
        #season-dropdown-menu button:hover { background: #333; }

        #episode-list-container { display: flex; flex-direction: column; gap: 10px; max-height: 450px; overflow-y: auto; }
        .episode-card { display: flex; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; background: #222; border: 1px solid transparent; transition: 0.2s; align-items: center; }
        .episode-card:hover { background: #2a2a2a; }
        .episode-card.active { border-color: #e50914; background: #252525; }
        .episode-thumbnail { width: 100px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
        .episode-details h3 { font-size: 0.85rem; margin: 0; color: #fff; }
        .episode-details p { font-size: 0.75rem; color: #888; margin: 3px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Info & Cast */
        #movie-overview { color: #ccc; line-height: 1.6; font-size: 1rem; margin-top: 20px; }
        #cast-list, #similar-movies { margin-top: 40px; }

        @media screen and (max-width: 1024px) {
            .main-content-wrapper { flex-direction: column; }
            .sidebar-column { width: 100%; position: static; max-height: none; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="home-button" title="Back to Home"><i class="fas fa-arrow-left"></i></a>
        <h1 id="movie-title">Loading...</h1>
    </header>

    <div class="page-container">
        <div class="main-content-wrapper">
            
            <div class="player-column">
                <div class="video-container">
                    <iframe id="movie-player" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; clipboard-write"></iframe>
                    <video id="hls-player" controls autoplay playsinline></video>
                </div>
                <p id="movie-overview"></p>
                <div id="cast-list"></div>
                <div id="similar-movies"></div>
            </div>

            <div class="sidebar-column">
                <div class="server-container">
                    <label><i class="fas fa-server"></i> Choose Server:</label>
                    <div id="server-buttons-container"></div>
                </div>

                <div id="collection-sidebar">
                    <label style="display: block; margin-bottom: 10px; color: #aaa; font-weight: bold;">
                        <i class="fas fa-layer-group"></i> Collection:
                    </label>
                    <div id="collection-list-container"></div>
                </div>

                <div class="tv-show-browser">
                    <label style="display: block; margin-bottom: 10px; color: #aaa; font-weight: bold;">Episodes:</label>
                    <div class="season-selector-container">
                        <button id="season-selector-btn">
                            <span id="selected-season-name">Season 1</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div id="season-dropdown-menu"></div>
                    </div>
                    <div id="episode-list-container"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/servers.js"></script>
    <script>
        // Core Player & TV/Anime/Movie Dispatcher
        const TMDB_API_KEY = "1e86095039d9eb32cbcf1aa445b23d92";
        const urlParams = new URLSearchParams(window.location.search);
        
        const mediaId = urlParams.get("id") || "1315772";
        const mediaType = (urlParams.get("type") || "movie").toLowerCase(); // 'movie', 'tv', o 'anime'
        let currentSeason = parseInt(urlParams.get("season")) || 1;
        let currentEpisode = parseInt(urlParams.get("episode")) || 1;
        let currentServerKey = "vidstorm";
        let mediaDetails = { id: mediaId, tmdb_id: mediaId, imdb_id: "" };
        let hlsInstance = null;

        const isEpisodic = mediaType === "tv" || mediaType === "anime";

        // Initialize Server Buttons
        function initServerButtons() {
            const container = document.getElementById("server-buttons-container");
            container.innerHTML = "";
            
            Object.keys(STREAM_SERVERS).forEach((key, index) => {
                const srv = STREAM_SERVERS[key];
                const btn = document.createElement("button");
                btn.className = `server-btn ${key === currentServerKey ? "active" : ""}`;
                btn.textContent = srv.name;
                btn.onclick = () => switchServer(key);
                container.appendChild(btn);
            });
        }

        // Switch Streaming Server
        async function switchServer(serverKey) {
            currentServerKey = serverKey;
            document.querySelectorAll(".server-btn").forEach(btn => {
                btn.classList.toggle("active", btn.textContent === STREAM_SERVERS[serverKey].name);
            });

            const iframe = document.getElementById("movie-player");
            const video = document.getElementById("hls-player");
            const srv = STREAM_SERVERS[serverKey];

            if (!srv) return;

            if (srv.type === "api_addon") {
                iframe.style.display = "none";
                video.style.display = "block";
                iframe.src = "";
                
                try {
                    const lookupId = mediaDetails.imdb_id || mediaDetails.id;
                    const reqUrl = srv.getStreamUrl(lookupId, isEpisodic ? "series" : "movie", currentSeason, currentEpisode);
                    const res = await fetch(reqUrl);
                    const data = await res.json();

                    if (data && data.streams && data.streams.length > 0) {
                        const streamUrl = data.streams[0].url;
                        if (Hls.isSupported()) {
                            if (hlsInstance) hlsInstance.destroy();
                            hlsInstance = new Hls();
                            hlsInstance.loadSource(streamUrl);
                            hlsInstance.attachMedia(video);
                        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                            video.src = streamUrl;
                        }
                    } else {
                        alert("Stream not found on this Asian server, please select another server.");
                    }
                } catch (err) {
                    console.error("Addon fetch error:", err);
                }
            } else {
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                video.pause();
                video.style.display = "none";
                iframe.style.display = "block";

                const streamType = isEpisodic ? "tv" : "movie";
                iframe.src = getEmbedUrl(serverKey, mediaDetails, streamType, currentSeason, currentEpisode);
            }
        }

        // Load Metadata & Episodes from TMDb
        async function loadMediaDetails() {
            initServerButtons();
            const tmdbType = isEpisodic ? "tv" : "movie";
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${tmdbType}/${mediaId}?api_key=${TMDB_API_KEY}&append_to_response=external_ids,credits,similar`);
                const data = await res.json();

                document.getElementById("movie-title").textContent = data.title || data.name || "Now Playing";
                document.getElementById("movie-overview").textContent = data.overview || "No overview available.";
                
                if (data.external_ids && data.external_ids.imdb_id) {
                    mediaDetails.imdb_id = data.external_ids.imdb_id;
                }

                // Setup TV/Anime Episode list
                if (isEpisodic && data.seasons) {
                    document.querySelector(".tv-show-browser").style.display = "block";
                    setupSeasons(data.seasons);
                    loadSeasonEpisodes(currentSeason);
                }

                switchServer(currentServerKey);
            } catch (err) {
                console.error("TMDb Load Error:", err);
                switchServer(currentServerKey);
            }
        }

        // Setup Seasons UI
        function setupSeasons(seasons) {
            const menu = document.getElementById("season-dropdown-menu");
            const btn = document.getElementById("season-selector-btn");
            menu.innerHTML = "";

            const validSeasons = seasons.filter(s => s.season_number > 0);
            validSeasons.forEach(s => {
                const sBtn = document.createElement("button");
                sBtn.textContent = s.name || `Season ${s.season_number}`;
                sBtn.onclick = () => {
                    currentSeason = s.season_number;
                    document.getElementById("selected-season-name").textContent = sBtn.textContent;
                    menu.style.display = "none";
                    loadSeasonEpisodes(currentSeason);
                };
                menu.appendChild(sBtn);
            });

            btn.onclick = () => {
                menu.style.display = menu.style.display === "block" ? "none" : "block";
            };
        }

        // Fetch and Render Episodes
        async function loadSeasonEpisodes(seasonNum) {
            const container = document.getElementById("episode-list-container");
            container.innerHTML = "<p style='color:#888; padding:10px;'>Loading episodes...</p>";

            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${mediaId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                container.innerHTML = "";

                if (!data.episodes || data.episodes.length === 0) {
                    container.innerHTML = "<p style='color:#888;'>No episodes available.</p>";
                    return;
                }

                data.episodes.forEach(ep => {
                    const card = document.createElement("div");
                    card.className = `episode-card ${ep.episode_number === currentEpisode ? "active" : ""}`;
                    
                    const thumb = ep.still_path ? `https://image.tmdb.org/t/p/w185${ep.still_path}` : 'images/logo-192.png';
                    card.innerHTML = `
                        <img class="episode-thumbnail" src="${thumb}" alt="EP ${ep.episode_number}" loading="lazy">
                        <div class="episode-details">
                            <h3>EP ${ep.episode_number}: ${ep.name || "Episode " + ep.episode_number}</h3>
                            <p>${ep.overview || "No description provided."}</p>
                        </div>
                    `;
                    card.onclick = () => {
                        currentEpisode = ep.episode_number;
                        document.querySelectorAll(".episode-card").forEach(c => c.classList.remove("active"));
                        card.classList.add("active");
                        switchServer(currentServerKey);
                    };
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = "<p style='color:#f44;'>Failed to load episodes.</p>";
            }
        }

        window.addEventListener("DOMContentLoaded", loadMediaDetails);
    </script>
</body>
</html>
